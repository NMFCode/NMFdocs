  assemblies:
  - NMF.Glsp
  namespace: NMF.Glsp.Contracts
  summary: >-
    Send an `initialize` request to the server. The server needs to be initialized in order to accept and

    process other requests and notifications. The {@link InitializeResult} ist cached and can be retrieved

    via the {@link GLSPClient.initializeResult} property.

    Only the first method invocation actually sends a request to the server. Subsequent invocations simply

    return the cached result.
  example: []
  syntax:
    content: >-
      [JsonRpcMethod("initialize")]

      Task<InitializeResult> InitializeAsync(string applicationId, string protocolVersion, IDictionary<string, object> args = null)
    parameters:
    - id: applicationId
      type: System.String
      description: ''
    - id: protocolVersion
      type: System.String
      description: ''
    - id: args
      type: System.Collections.Generic.IDictionary{System.String,System.Object}
      description: ''
    return:
      type: System.Threading.Tasks.Task{NMF.Glsp.Protocol.Lifecycle.InitializeResult}
      description: A promise of the {@link InitializeResult}.
    content.vb: >-
      <JsonRpcMethod("initialize")>

      Function InitializeAsync(applicationId As String, protocolVersion As String, args As IDictionary(Of String, Object) = Nothing) As Task(Of InitializeResult)
