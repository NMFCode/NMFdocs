  nameWithType: IGlspServer.InitializeClientSessionAsync(string, string, string[], IDictionary<string, object>)
  fullName: NMF.Glsp.Contracts.IGlspServer.InitializeClientSessionAsync(string, string, string[], System.Collections.Generic.IDictionary<string, object>)
  type: Method
  source:
    remote:
      path: Glsp/Glsp/Contracts/IGlspServer.cs
      branch: main
      repo: https://github.com/NMFCode/NMF.git
    id: InitializeClientSessionAsync
    path: src/Glsp/Glsp/Contracts/IGlspServer.cs
    startLine: 39
  assemblies:
  - NMF.Glsp
  namespace: NMF.Glsp.Contracts
  summary: >-
    Send an `initializeClientSession` request to the server. One client application may open several session.

    Each individual diagram on the client side counts as one session and has to provide

    a unique clientId.
  example: []
  syntax:
    content: >-
      [JsonRpcMethod("initializeClientSession")]

      Task InitializeClientSessionAsync(string clientSessionId, string diagramType, string[] clientActionKinds = null, IDictionary<string, object> args = null)
    parameters:
    - id: clientSessionId
      type: System.String
      description: Unique identifier for the new client session
    - id: diagramType
      type: System.String
      description: Unique identifier of the diagram type for which the session should be configured.
    - id: clientActionKinds
      type: System.String[]
      description: >-
        The set of action kinds that can be handled by the client.
             Used by the server to know which dispatched actions should be forwarded to the client.
    - id: args
      type: System.Collections.Generic.IDictionary{System.String,System.Object}
      description: Additional custom arguments.
    return:
      type: System.Threading.Tasks.Task
      description: A promise that resolves if the initialization was successful
    content.vb: >-
      <JsonRpcMethod("initializeClientSession")>

      Function InitializeClientSessionAsync(clientSessionId As String, diagramType As String, clientActionKinds As String() = Nothing, args As IDictionary(Of String, Object) = Nothing) As Task
  overload: NMF.Glsp.Contracts.IGlspServer.InitializeClientSessionAsync*
