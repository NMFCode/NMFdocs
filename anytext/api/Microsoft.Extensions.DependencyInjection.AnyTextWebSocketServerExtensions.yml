  assemblies:
  - NMF.AnyText.AspNetCore
  namespace: Microsoft.Extensions.DependencyInjection
  summary: Declares a synchronization between multiple files
  example: []
  syntax:
    content: 'public static void AddSynchronization<TLeft, TRight, TSynchronization, TStartRule>(this IServiceCollection services, string leftExtension, string rightExtension, bool isAutomatic = false, SynchronizationDirection direction = SynchronizationDirection.LeftWins, bool opposeDirection = true) where TLeft : class, IModelElement where TRight : class, IModelElement where TSynchronization : ReflectiveSynchronization, new() where TStartRule : SynchronizationRule<TLeft, TRight>'
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service container the synchronization should be added to
    - id: leftExtension
      type: System.String
      description: the file extension of the left model
    - id: rightExtension
      type: System.String
      description: the file extension of the right model
    - id: isAutomatic
      type: System.Boolean
      description: true, if the synchronization should be started automatically
    - id: direction
      type: NMF.Synchronizations.SynchronizationDirection
      description: the default direction of the synchronization
    - id: opposeDirection
      type: System.Boolean
      description: true, if the direction should be opposed automatically if the synchronization is initiated from the right model, otherwise false. Does not have an effect on check-only synchronizations.
    typeParameters:
    - id: TLeft
      description: the type of the left model
    - id: TRight
      description: the type of the right model
    - id: TSynchronization
      description: the type of the synchronization
    - id: TStartRule
      description: the type of the start rule
    content.vb: Public Shared Sub AddSynchronization(Of TLeft As {Class, IModelElement}, TRight As {Class, IModelElement}, TSynchronization As {ReflectiveSynchronization, New}, TStartRule As SynchronizationRule(Of TLeft, TRight))(services As IServiceCollection, leftExtension As String, rightExtension As String, isAutomatic As Boolean = False, direction As SynchronizationDirection = SynchronizationDirection.LeftWins, opposeDirection As Boolean = True)
