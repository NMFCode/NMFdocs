  assemblies:
  - NMF.AnyText.Core
  namespace: NMF.AnyText
  summary: Tracks and creates a new <xref href="NMF.AnyText.Workspace.WorkspaceEdit" data-throw-if-not-resolved="false"></xref> with the provided text edits.
  remarks: >-
    This method increments an internal counter to track the number of pending workspace edits.

    This is typically used to prevent the system from reparsing changes that were generated

    by the synchronization logic itself, thus avoiding infinite loops.
  example: []
  syntax:
    content: public WorkspaceEdit TrackAndCreateWorkspaceEdit(TextEdit[] edit, Uri documentUri)
    parameters:
    - id: edit
      type: NMF.AnyText.TextEdit[]
      description: An array of <xref href="NMF.AnyText.TextEdit" data-throw-if-not-resolved="false"></xref> objects representing the changes to be applied.
    - id: documentUri
      type: System.Uri
      description: The URI of the document to which the changes apply.
    return:
      type: NMF.AnyText.Workspace.WorkspaceEdit
      description: A new <xref href="NMF.AnyText.Workspace.WorkspaceEdit" data-throw-if-not-resolved="false"></xref> instance containing the provided text edits.
    content.vb: Public Function TrackAndCreateWorkspaceEdit(edit As TextEdit(), documentUri As Uri) As WorkspaceEdit
