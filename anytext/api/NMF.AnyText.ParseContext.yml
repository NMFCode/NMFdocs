  summary: Determines whether a change should trigger a reparsing of the document.
  remarks: >-
    This method is designed to prevent infinite loops in a synchronization system.

    It checks if there are any pending workspace edits that were generated by the system.
  example: []
  syntax:
    content: public bool ShouldParseChange()
    return:
      type: System.Boolean
      description: <code>false</code> if there are pending workspace edits from the system; otherwise, <code>true</code>.
