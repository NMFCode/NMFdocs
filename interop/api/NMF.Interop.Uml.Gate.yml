    id: GetName
    path: src/Interop/UMLInterop/Uml/Gate.cs
    startLine: 464
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: " This query returns the name of the gate, either the explicit name (.name) or the constructed name ('out_\" or 'in_' concatenated in front of .message.name) if the explicit name is not present.\r\nresult = (if name-&gt;notEmpty() then name-&gt;asOrderedSet()-&gt;first()\r\nelse  if isActual() or isOutsideCF() \r\n  then if isSend() \r\n    then 'out_'.concat(self.message.name-&gt;asOrderedSet()-&gt;first())\r\n    else 'in_'.concat(self.message.name-&gt;asOrderedSet()-&gt;first())\r\n    endif\r\n  else if isSend()\r\n    then 'in_'.concat(self.message.name-&gt;asOrderedSet()-&gt;first())\r\n    else 'out_'.concat(self.message.name-&gt;asOrderedSet()-&gt;first())\r\n    endif\r\n  endif\r\nendif)\r\n&lt;p&gt;From package UML::Interactions.&lt;/p&gt;"
  example: []
  syntax:
    content: public string GetName()
    return:
      type: System.String
    content.vb: Public Function GetName() As String
