- uid: NMF.Interop.Uml.Gate.Matches(NMF.Interop.Uml.IGate)
  commentId: M:NMF.Interop.Uml.Gate.Matches(NMF.Interop.Uml.IGate)
  id: Matches(NMF.Interop.Uml.IGate)
  parent: NMF.Interop.Uml.Gate
  langs:
  - csharp
  - vb
  name: Matches(IGate)
  nameWithType: Gate.Matches(IGate)
  fullName: NMF.Interop.Uml.Gate.Matches(NMF.Interop.Uml.IGate)
  type: Method
  source:
    remote:
      path: Interop/UMLInterop/Uml/Gate.cs
      branch: main
      repo: https://github.com/NMFCode/NMF.git
    id: Matches
    path: src/Interop/UMLInterop/Uml/Gate.cs
    startLine: 499
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: " This query returns true if the name of this Gate matches the name of the in parameter Gate, and the messages for the two Gates correspond. The Message for one Gate (say A) corresponds to the Message for another Gate (say B) if (A and B have the same name value) and (if A is a sendEvent then B is a receiveEvent) and (if A is a receiveEvent then B is a sendEvent) and (A and B have the same messageSort value) and (A and B have the same signature value).\r\nresult = (self.getName() = gateToMatch.getName() and \r\nself.message.messageSort = gateToMatch.message.messageSort and\r\nself.message.name = gateToMatch.message.name and\r\nself.message.sendEvent-&gt;includes(self) implies gateToMatch.message.receiveEvent-&gt;includes(gateToMatch)  and\r\nself.message.receiveEvent-&gt;includes(self) implies gateToMatch.message.sendEvent-&gt;includes(gateToMatch) and\r\nself.message.signature = gateToMatch.message.signature)\r\n&lt;p&gt;From package UML::Interactions.&lt;/p&gt;"
  example: []
  syntax:
    content: public bool Matches(IGate gateToMatch)
    parameters:
    - id: gateToMatch
      type: NMF.Interop.Uml.IGate
      description: ''
    return:
      type: System.Boolean
    content.vb: Public Function Matches(gateToMatch As IGate) As Boolean
  overload: NMF.Interop.Uml.Gate.Matches*
  implements:
  - NMF.Interop.Uml.IGate.Matches(NMF.Interop.Uml.IGate)
