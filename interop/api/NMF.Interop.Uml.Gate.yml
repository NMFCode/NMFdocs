    startLine: 165
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: " If this Gate is outside an 'alt' CombinedFragment,  for every InteractionOperator inside that CombinedFragment there must be exactly one matching Gate inside the CombindedFragment with its opposing end enclosed by that InteractionOperator. If this Gate is outside CombinedFragment with operator other than 'alt',   there must be exactly one matching Gate inside that CombinedFragment.\r\nisOutsideCF() implies\r\n if self.combinedFragment.interactionOperator-&gt;asOrderedSet()-&gt;first() = InteractionOperatorKind::alt\r\n then self.combinedFragment.operand-&gt;forAll(op : InteractionOperand |\r\n self.combinedFragment.cfragmentGate-&gt;select(isInsideCF() and \r\n oppositeEnd().enclosingFragment()-&gt;includes(self.combinedFragment) and matches(self))-&gt;size()=1)\r\n else  self.combinedFragment.cfragmentGate-&gt;select(isInsideCF() and matches(self))-&gt;size()=1\r\n endif"
  example: []
  syntax:
    content: public bool Outside_cf_matched(object diagnostics, object context)
    parameters:
    - id: diagnostics
      type: System.Object
      description: The chain of diagnostics to which problems are to be appended.
    - id: context
      type: System.Object
      description: The cache of context-specific information.
    return:
      type: System.Boolean
