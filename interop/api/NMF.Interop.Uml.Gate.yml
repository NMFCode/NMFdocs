  langs:
  - csharp
  - vb
  name: IsOutsideCF()
  nameWithType: Gate.IsOutsideCF()
  fullName: NMF.Interop.Uml.Gate.IsOutsideCF()
  type: Method
  source:
    remote:
      path: Interop/UMLInterop/Uml/Gate.cs
      branch: main
      repo: https://github.com/NMFCode/NMF.git
    id: IsOutsideCF
    path: src/Interop/UMLInterop/Uml/Gate.cs
    startLine: 329
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: " This query returns true if this Gate is attached to the boundary of a CombinedFragment, and its other end (if present)  is outside of the same CombinedFragment.\r\nresult = (self.oppositeEnd()-&gt; notEmpty() and combinedFragment-&gt;notEmpty() implies\r\nlet oppEnd : MessageEnd = self.oppositeEnd()-&gt;asOrderedSet()-&gt;first() in\r\nif oppEnd.oclIsKindOf(MessageOccurrenceSpecification) \r\nthen let oppMOS : MessageOccurrenceSpecification = oppEnd.oclAsType(MessageOccurrenceSpecification)\r\nin  self.combinedFragment.enclosingInteraction.oclAsType(InteractionFragment)-&gt;asSet()-&gt;\r\n     union(self.combinedFragment.enclosingOperand.oclAsType(InteractionFragment)-&gt;asSet()) =\r\n     oppMOS.enclosingInteraction.oclAsType(InteractionFragment)-&gt;asSet()-&gt;\r\n     union(oppMOS.enclosingOperand.oclAsType(InteractionFragment)-&gt;asSet())\r\nelse let oppGate : Gate = oppEnd.oclAsType(Gate) \r\nin self.combinedFragment.enclosingInteraction.oclAsType(InteractionFragment)-&gt;asSet()-&gt;\r\n     union(self.combinedFragment.enclosingOperand.oclAsType(InteractionFragment)-&gt;asSet()) =\r\n     oppGate.combinedFragment.enclosingInteraction.oclAsType(InteractionFragment)-&gt;asSet()-&gt;\r\n     union(oppGate.combinedFragment.enclosingOperand.oclAsType(InteractionFragment)-&gt;asSet())\r\nendif)\r\n&lt;p&gt;From package UML::Interactions.&lt;/p&gt;"
  example: []
  syntax:
    content: public bool IsOutsideCF()
    return:
      type: System.Boolean
    content.vb: Public Function IsOutsideCF() As Boolean
  overload: NMF.Interop.Uml.Gate.IsOutsideCF*
  implements:
  - NMF.Interop.Uml.IGate.IsOutsideCF
