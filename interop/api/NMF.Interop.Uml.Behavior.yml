  summary: " A Behavior that is directly owned as a nestedClassifier does not have a context. Otherwise, to determine the context of a Behavior, find the first BehavioredClassifier reached by following the chain of owner relationships from the Behavior, if any. If there is such a BehavioredClassifier, then it is the context, unless it is itself a Behavior with a non-empty context, in which case that is also the context for the original Behavior.\r\nresult = (if nestingClass &lt;&gt; null then\r\n    null\r\nelse\r\n    let b:BehavioredClassifier = self.behavioredClassifier(self.owner) in\r\n    if b.oclIsKindOf(Behavior) and b.oclAsType(Behavior)._'context' &lt;&gt; null then \r\n        b.oclAsType(Behavior)._'context'\r\n    else \r\n        b \r\n    endif\r\nendif\r\n        )\r\n&lt;p&gt;From package UML::CommonBehavior.&lt;/p&gt;"
  example: []
  syntax:
    content: public IBehavioredClassifier GetContext()
    return:
      type: NMF.Interop.Uml.IBehavioredClassifier
    content.vb: Public Function GetContext() As IBehavioredClassifier
  overload: NMF.Interop.Uml.Behavior.GetContext*
  implements:
  - NMF.Interop.Uml.IBehavior.GetContext
