  summary: " All StructuralFeatures related to the Classifier that may have Slots, including direct attributes, inherited attributes, private attributes in generalizations, and memberEnds of Associations, but excluding redefined StructuralFeatures.\r\nresult = (member-&gt;select(oclIsKindOf(StructuralFeature))-&gt;\r\n  collect(oclAsType(StructuralFeature))-&gt;\r\n   union(self.inherit(self.allParents()-&gt;collect(p | p.attribute)-&gt;asSet())-&gt;\r\n     collect(oclAsType(StructuralFeature)))-&gt;asSet())\r\n&lt;p&gt;From package UML::Classification.&lt;/p&gt;"
