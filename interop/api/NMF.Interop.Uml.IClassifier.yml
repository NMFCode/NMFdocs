  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: " The Classifier that maps to a GeneralizationSet may neither be a specific nor a general Classifier in any of the Generalization relationships defined for that GeneralizationSet. In other words, a power type may not be an instance of itself nor may its instances also be its subclasses.\r\npowertypeExtent-&gt;forAll( gs | \r\n  gs.generalization-&gt;forAll( gen | \r\n    not (gen.general = self) and not gen.general.allParents()-&gt;includes(self) and not (gen.specific = self) and not self.allParents()-&gt;includes(gen.specific) \r\n  ))"
  example: []
