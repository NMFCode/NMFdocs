  source:
    remote:
      path: Interop/UMLInterop/Uml/IClassifier.cs
      branch: main
      repo: https://github.com/NMFCode/NMF.git
    id: AllAttributes
    path: src/Interop/UMLInterop/Uml/IClassifier.cs
    startLine: 405
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: " The query allAttributes gives an ordered set of all owned and inherited attributes of the Classifier. All owned attributes appear before any inherited attributes, and the attributes inherited from any more specific parent Classifier appear before those of any more general parent Classifier. However, if the Classifier has multiple immediate parents, then the relative ordering of the sets of attributes from those parents is not defined.\r\nresult = (attribute-&gt;asSequence()-&gt;union(parents()-&gt;asSequence().allAttributes())-&gt;select(p | member-&gt;includes(p))-&gt;asOrderedSet())\r\n&lt;p&gt;From package UML::Classification.&lt;/p&gt;"
  example: []
  syntax:
    content: IOrderedSetExpression<IProperty> AllAttributes()
    return:
      type: NMF.Collections.Generic.IOrderedSetExpression{NMF.Interop.Uml.IProperty}
    content.vb: Function AllAttributes() As IOrderedSetExpression(Of IProperty)
  overload: NMF.Interop.Uml.IClassifier.AllAttributes*
