  summary: " Specifies the visibility of the imported PackageableElement within the importingNamespace, i.e., whether the  importedElement will in turn be visible to other Namespaces. If the ElementImport is public, the importedElement will be visible outside the importingNamespace while, if the ElementImport is private, it will not.\r\n&lt;p&gt;From package UML::CommonStructure.&lt;/p&gt;"
  example: []
  syntax:
