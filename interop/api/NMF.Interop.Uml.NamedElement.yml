    id: AllOwningPackages
    path: src/Interop/UMLInterop/Uml/NamedElement.cs
    startLine: 529
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: " The query allOwningPackages() returns the set of all the enclosing Namespaces of this NamedElement, working outwards, that are Packages, up to but not including the first such Namespace that is not a Package.\r\nresult = (if namespace.oclIsKindOf(Package)\r\nthen\r\n  let owningPackage : Package = namespace.oclAsType(Package) in\r\n    owningPackage-&gt;union(owningPackage.allOwningPackages())\r\nelse\r\n  null\r\nendif)\r\n&lt;p&gt;From package UML::CommonStructure.&lt;/p&gt;"
