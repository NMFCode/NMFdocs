  summary: " If the interactionOperator is break, the corresponding InteractionOperand must cover all Lifelines covered by the enclosing InteractionFragment.\r\ninteractionOperator=InteractionOperatorKind::break  implies   \r\nenclosingInteraction.oclAsType(InteractionFragment)-&gt;asSet()-&gt;union(\r\n   enclosingOperand.oclAsType(InteractionFragment)-&gt;asSet()).covered-&gt;asSet() = self.covered-&gt;asSet()"
  example: []
  syntax:
