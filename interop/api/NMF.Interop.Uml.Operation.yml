- uid: NMF.Interop.Uml.Operation.GetNamesOfMember(NMF.Interop.Uml.INamedElement)
  commentId: M:NMF.Interop.Uml.Operation.GetNamesOfMember(NMF.Interop.Uml.INamedElement)
  id: GetNamesOfMember(NMF.Interop.Uml.INamedElement)
  parent: NMF.Interop.Uml.Operation
  langs:
  - csharp
  - vb
  name: GetNamesOfMember(INamedElement)
  nameWithType: Operation.GetNamesOfMember(INamedElement)
  fullName: NMF.Interop.Uml.Operation.GetNamesOfMember(NMF.Interop.Uml.INamedElement)
  type: Method
  source:
    remote:
      path: Interop/UMLInterop/Uml/Operation.cs
      branch: main
      repo: https://github.com/NMFCode/NMF.git
    id: GetNamesOfMember
    path: src/Interop/UMLInterop/Uml/Operation.cs
    startLine: 1917
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: " The query getNamesOfMember() gives a set of all of the names that a member would have in a Namespace, taking importing into account. In general a member can have multiple names in a Namespace if it is imported more than once with different aliases.\r\nresult = (if self.ownedMember -&gt;includes(element)\r\nthen Set{element.name}\r\nelse let elementImports : Set(ElementImport) = self.elementImport-&gt;select(ei | ei.importedElement = element) in\r\n  if elementImports-&gt;notEmpty()\r\n  then\r\n     elementImports-&gt;collect(el | el.getName())-&gt;asSet()\r\n  else \r\n     self.packageImport-&gt;select(pi | pi.importedPackage.visibleMembers().oclAsType(NamedElement)-&gt;includes(element))-&gt; collect(pi | pi.importedPackage.getNamesOfMember(element))-&gt;asSet()\r\n  endif\r\nendif)\r\n&lt;p&gt;From package UML::CommonStructure.&lt;/p&gt;"
  example: []
  syntax:
    content: public ISetExpression<string> GetNamesOfMember(INamedElement element)
    parameters:
    - id: element
      type: NMF.Interop.Uml.INamedElement
      description: ''
    return:
      type: NMF.Expressions.ISetExpression{System.String}
    content.vb: Public Function GetNamesOfMember(element As INamedElement) As ISetExpression(Of String)
  overload: NMF.Interop.Uml.Operation.GetNamesOfMember*
  implements:
  - NMF.Interop.Uml.INamespace.GetNamesOfMember(NMF.Interop.Uml.INamedElement)
