  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: " If the sendEvent and the receiveEvent of the same Message are on the same Lifeline, the sendEvent must be ordered before the receiveEvent.\r\nreceiveEvent.oclIsKindOf(MessageOccurrenceSpecification)\r\nimplies\r\nlet f :  Lifeline = sendEvent-&gt;select(oclIsKindOf(MessageOccurrenceSpecification)).oclAsType(MessageOccurrenceSpecification)-&gt;asOrderedSet()-&gt;first().covered in\r\nf = receiveEvent-&gt;select(oclIsKindOf(MessageOccurrenceSpecification)).oclAsType(MessageOccurrenceSpecification)-&gt;asOrderedSet()-&gt;first().covered  implies\r\nf.events-&gt;indexOf(sendEvent.oclAsType(MessageOccurrenceSpecification)-&gt;asOrderedSet()-&gt;first() ) &lt; \r\nf.events-&gt;indexOf(receiveEvent.oclAsType(MessageOccurrenceSpecification)-&gt;asOrderedSet()-&gt;first() )"
  example: []
  syntax:
    content: bool Sending_receiving_message_event(object diagnostics, object context)
    parameters:
