    id: Cannot_cross_boundaries
    path: src/Interop/UMLInterop/Uml/IMessage.cs
    startLine: 187
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: " Messages cannot cross boundaries of CombinedFragments or their operands.  This is true if and only if both MessageEnds are enclosed within the same InteractionFragment (i.e., an InteractionOperand or an Interaction).\r\nsendEvent-&gt;notEmpty() and receiveEvent-&gt;notEmpty() implies\r\nlet sendEnclosingFrag : Set(InteractionFragment) = \r\nsendEvent-&gt;asOrderedSet()-&gt;first().enclosingFragment()\r\nin \r\nlet receiveEnclosingFrag : Set(InteractionFragment) = \r\nreceiveEvent-&gt;asOrderedSet()-&gt;first().enclosingFragment()\r\nin  sendEnclosingFrag = receiveEnclosingFrag"
  example: []
  syntax:
    content: bool Cannot_cross_boundaries(object diagnostics, object context)
    parameters:
    - id: diagnostics
      type: System.Object
      description: The chain of diagnostics to which problems are to be appended.
    - id: context
      type: System.Object
      description: The cache of context-specific information.
    return:
      type: System.Boolean
    content.vb: Function Cannot_cross_boundaries(diagnostics As Object, context As Object) As Boolean
