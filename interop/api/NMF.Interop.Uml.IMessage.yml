  source:
    remote:
      path: Interop/UMLInterop/Uml/IMessage.cs
      branch: main
      repo: https://github.com/NMFCode/NMF.git
    id: Signature_is_signal
    path: src/Interop/UMLInterop/Uml/IMessage.cs
    startLine: 204
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: " In the case when the Message signature is a Signal, the arguments of the Message must correspond to the attributes of the Signal. A Message Argument corresponds to a Signal Attribute if the Argument is of the same Class or a specialization of that of the Attribute.\r\n(messageSort = MessageSort::asynchSignal ) and signature.oclIsKindOf(Signal) implies\r\n   let signalAttributes : OrderedSet(Property) = signature.oclAsType(Signal).inheritedMember()-&gt;\r\n             select(n:NamedElement | n.oclIsTypeOf(Property))-&gt;collect(oclAsType(Property))-&gt;asOrderedSet()\r\n   in signalAttributes-&gt;size() = self.argument-&gt;size()\r\n   and self.argument-&gt;forAll( o: ValueSpecification |\r\n          not (o.oclIsKindOf(Expression)\r\n          and o.oclAsType(Expression).symbol-&gt;size()=0\r\n          and o.oclAsType(Expression).operand-&gt;isEmpty() ) implies\r\n              let p : Property = signalAttributes-&gt;at(self.argument-&gt;indexOf(o))\r\n              in o.type.oclAsType(Classifier).conformsTo(p.type.oclAsType(Classifier)))"
  example: []
  syntax:
    content: bool Signature_is_signal(object diagnostics, object context)
    parameters:
    - id: diagnostics
      type: System.Object
      description: The chain of diagnostics to which problems are to be appended.
    - id: context
      type: System.Object
      description: The cache of context-specific information.
    return:
      type: System.Boolean
    content.vb: Function Signature_is_signal(diagnostics As Object, context As Object) As Boolean
