  namespace: NMF.Interop.Uml
  summary: " A Generalization is a taxonomic relationship between a more general Classifier and a more specific Classifier. Each instance of the specific Classifier is also an instance of the general Classifier. The specific Classifier inherits the features of the more general Classifier. A Generalization is owned by the specific Classifier.\r\n&lt;p&gt;From package UML::Classification.&lt;/p&gt;"
