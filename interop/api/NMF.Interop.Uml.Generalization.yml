  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: " Indicates whether the specific Classifier can be used wherever the general Classifier can be used. If true, the execution traces of the specific Classifier shall be a superset of the execution traces of the general Classifier. If false, there is no such constraint on execution traces. If unset, the modeler has not stated whether there is such a constraint or not.\r\n&lt;p&gt;From package UML::Classification.&lt;/p&gt;"
  example: []
  syntax:
    content: >-
