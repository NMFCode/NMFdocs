  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Legacy.Cmof
  summary: " Constraint contains a ValueSpecification that specifies additional semantics for one or more elements. Certain kinds of constraints (such as an association \"xor\" constraint) are predefined in UML, others may be user-defined. A user-defined Constraint is described using a specified language, whose syntax and interpretation is a tool responsibility. One predefined language for writing constraints is OCL. In some situations, a programming language such as Java may be appropriate for expressing a constraint. In other situations natural language may be used.\r\n\r\n\r\n\r\nConstraint is a condition (a Boolean expression) that restricts the extension of the associated element beyond what is imposed by the other language constructs applied to the element. Constraint contains an optional name, although they are commonly unnamed."
  example: []
  syntax:
    content: >-
      [AlternativeNamespace("http://schema.omg.org/spec/mof/2.0/emof.xmi")]

      [XmlNamespace("http://schema.omg.org/spec/MOF/2.0/cmof.xml")]

      [XmlNamespacePrefix("cmof")]

      [ModelRepresentationClass("http://schema.omg.org/spec/MOF/2.0/cmof.xml#//Constraint")]

      public class Constraint : PackageableElement, IConstraint, IPackageableElement, INamedElement, IElement, IModelElement, INotifyPropertyChanged, INotifyPropertyChanging
