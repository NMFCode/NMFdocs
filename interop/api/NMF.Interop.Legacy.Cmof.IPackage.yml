  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Legacy.Cmof
  summary: " The query makesVisible() defines whether a Package makes an element visible outside itself. Elements with no visibility and elements with public visibility are made visible.\r\nself.member-&gt;includes(el)\r\nresult = (ownedMember-&gt;includes(el)) or\r\n   (elementImport-&gt;\r\n      select(ei|ei.visibility = #public)-&gt;\r\n         collect(ei|ei.importedElement)-&gt;includes(el)) or\r\n   (packageImport-&gt;\r\n      select(pi|pi.visibility = #public)-&gt;\r\n        collect(pi|\r\n           pi.importedPackage.member-&gt;includes(el))-&gt;notEmpty())"
  example: []
  syntax:
    content: bool MakesVisible(INamedElement el)
    parameters:
    - id: el
      type: NMF.Interop.Legacy.Cmof.INamedElement
      description: ''
    return:
      type: System.Boolean
    content.vb: Function MakesVisible(el As INamedElement) As Boolean
  overload: NMF.Interop.Legacy.Cmof.IPackage.MakesVisible*
