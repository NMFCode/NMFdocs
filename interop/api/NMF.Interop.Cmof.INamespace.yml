  namespace: NMF.Interop.Cmof
  summary: " The query importMembers() defines which of a set of PackageableElements are actually imported into the namespace. This excludes hidden ones, i.e., those which have names that conflict with names of owned members, and also excludes elements which would have the same name when imported.\r\nresult = self.excludeCollisions(imps)-&gt;select(imp | self.ownedMember-&gt;forAll(mem |\r\nmem.imp.isDistinguishableFrom(mem, self)))"
