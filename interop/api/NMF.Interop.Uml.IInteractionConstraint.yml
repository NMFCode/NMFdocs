  namespace: NMF.Interop.Uml
  summary: " If maxint is specified, then minint must be specified and the evaluation of maxint must be &gt;= the evaluation of minint.\r\nmaxint-&gt;notEmpty() implies (minint-&gt;notEmpty() and \r\nmaxint-&gt;asSequence()-&gt;first().integerValue() &gt;=\r\nminint-&gt;asSequence()-&gt;first().integerValue() )"
  example: []
  syntax:
    content: bool Maxint_greater_equal_minint(object diagnostics, object context)
    parameters:
    - id: diagnostics
      type: System.Object
      description: The chain of diagnostics to which problems are to be appended.
    - id: context
      type: System.Object
      description: The cache of context-specific information.
    return:
      type: System.Boolean
    content.vb: Function Maxint_greater_equal_minint(diagnostics As Object, context As Object) As Boolean
