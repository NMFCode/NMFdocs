  namespace: NMF.Interop.Uml
  summary: " A package can have one or more profile applications to indicate which profiles have been applied. Because a profile is a package, it is possible to apply a profile not only to packages, but also to profiles.\r\nPackage specializes TemplateableElement and PackageableElement specializes ParameterableElement to specify that a package can be used as a template and a PackageableElement as a template parameter.\r\nA package is used to group elements, and provides a namespace for the grouped elements.\r\n&lt;p&gt;From package UML::Packages.&lt;/p&gt;"
  example: []
  syntax:
    content: >-
      [XmlNamespace("http://www.eclipse.org/uml2/5.0.0/UML")]

      [XmlNamespacePrefix("uml")]

      [ModelRepresentationClass("http://www.eclipse.org/uml2/5.0.0/UML#//Package")]

      public class Package : Namespace, IPackage, ITemplateableElement, IPackageableElement, IParameterableElement, INamespace, INamedElement, IElement, IEModelElement, IModelElement, INotifyPropertyChanged, INotifyPropertyChanging
