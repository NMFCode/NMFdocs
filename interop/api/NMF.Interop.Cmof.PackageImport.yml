  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Cmof
  summary: Specifies the visibility of the imported PackageableElements within the importing Namespace, i.e., whether imported elements will in turn be visible to other packages that use that importingPackage as an importedPackage. If the PackageImport is public, the imported elements will be visible outside the package, while if it is private they will not.
  example: []
  syntax:
    content: >-
      [XmlElementName("visibility")]

      [XmlAttribute(true)]

