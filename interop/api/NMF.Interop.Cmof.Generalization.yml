  namespace: NMF.Interop.Cmof
  summary: Indicates whether the specific classifier can be used wherever the general classifier can be used. If true, the execution traces of the specific classifier will be a superset of the execution traces of the general classifier.
  example: []
  syntax:
    content: >-
      [XmlElementName("isSubstitutable")]

      [XmlAttribute(true)]

      public bool? IsSubstitutable { get; set; }
