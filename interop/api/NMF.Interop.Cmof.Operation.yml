  commentId: M:NMF.Interop.Cmof.Operation.GetNamesOfMember(NMF.Interop.Cmof.INamedElement)
  id: GetNamesOfMember(NMF.Interop.Cmof.INamedElement)
  parent: NMF.Interop.Cmof.Operation
  langs:
  - csharp
  - vb
  name: GetNamesOfMember(INamedElement)
  nameWithType: Operation.GetNamesOfMember(INamedElement)
  fullName: NMF.Interop.Cmof.Operation.GetNamesOfMember(NMF.Interop.Cmof.INamedElement)
  type: Method
  source:
    remote:
      path: Interop/UMLInterop/Cmof/Operation.cs
      branch: main
      repo: https://github.com/NMFCode/NMF.git
    id: GetNamesOfMember
    path: src/Interop/UMLInterop/Cmof/Operation.cs
    startLine: 1206
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Cmof
  summary: " The query getNamesOfMember() takes importing into account. It gives back the set of names that an element would have in an importing namespace, either because it is owned, or if not owned then imported individually, or if not individually then from a package.\r\nThe query getNamesOfMember() gives a set of all of the names that a member would have in a Namespace. In general a member can have multiple names in a Namespace if it is imported more than once with different aliases. The query takes account of importing. It gives back the set of names that an element would have in an importing namespace, either because it is owned, or if not owned then imported individually, or if not individually then from a package.\r\nresult = if self.ownedMember -&gt;includes(element)\r\nthen Set{}-&gt;include(element.name)\r\nelse let elementImports: ElementImport = self.elementImport-&gt;select(ei | ei.importedElement = element) in\r\n  if elementImports-&gt;notEmpty()\r\n  then elementImports-&gt;collect(el | el.getName())\r\n  else self.packageImport-&gt;select(pi | pi.importedPackage.visibleMembers()-&gt;includes(element))-&gt; collect(pi | pi.importedPackage.getNamesOfMember(element))\r\n  endif\r\nendif"
  example: []
  syntax:
    content: public ISetExpression<string> GetNamesOfMember(INamedElement element)
    parameters:
    - id: element
      type: NMF.Interop.Cmof.INamedElement
      description: ''
    return:
      type: NMF.Expressions.ISetExpression{System.String}
    content.vb: Public Function GetNamesOfMember(element As INamedElement) As ISetExpression(Of String)
  overload: NMF.Interop.Cmof.Operation.GetNamesOfMember*
  implements:
  - NMF.Interop.Cmof.INamespace.GetNamesOfMember(NMF.Interop.Cmof.INamedElement)
