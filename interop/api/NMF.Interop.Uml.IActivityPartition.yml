  name: Represents_classifier(object, object)
  nameWithType: IActivityPartition.Represents_classifier(object, object)
  fullName: NMF.Interop.Uml.IActivityPartition.Represents_classifier(object, object)
  type: Method
  source:
    remote:
      path: Interop/UMLInterop/Uml/IActivityPartition.cs
      branch: main
      repo: https://github.com/NMFCode/NMF.git
    id: Represents_classifier
    path: src/Interop/UMLInterop/Uml/IActivityPartition.cs
    startLine: 183
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: " If a non-external ActivityPartition represents a Classifier and has a superPartition, then the superPartition must represent a Classifier, and the Classifier of the subpartition must be nested (nestedClassifier or ownedBehavior) in the Classifier represented by the superPartition, or be at the contained end of a composition Association with the Classifier represented by the superPartition.\r\n(not isExternal and represents.oclIsKindOf(Classifier) and superPartition-&gt;notEmpty()) implies\r\n(\r\n   let representedClassifier : Classifier = represents.oclAsType(Classifier) in\r\n     superPartition.represents.oclIsKindOf(Classifier) and\r\n      let representedSuperClassifier : Classifier = superPartition.represents.oclAsType(Classifier) in\r\n       (representedSuperClassifier.oclIsKindOf(BehavioredClassifier) and representedClassifier.oclIsKindOf(Behavior) and \r\n        representedSuperClassifier.oclAsType(BehavioredClassifier).ownedBehavior-&gt;includes(representedClassifier.oclAsType(Behavior))) \r\n       or\r\n       (representedSuperClassifier.oclIsKindOf(Class) and  representedSuperClassifier.oclAsType(Class).nestedClassifier-&gt;includes(representedClassifier))\r\n       or\r\n       (Association.allInstances()-&gt;exists(a | a.memberEnd-&gt;exists(end1 | end1.isComposite and end1.type = representedClassifier and \r\n                                                                      a.memberEnd-&gt;exists(end2 | end1&lt;&gt;end2 and end2.type = representedSuperClassifier))))\r\n)"
  example: []
  syntax:
    content: bool Represents_classifier(object diagnostics, object context)
    parameters:
    - id: diagnostics
      type: System.Object
      description: The chain of diagnostics to which problems are to be appended.
    - id: context
      type: System.Object
      description: The cache of context-specific information.
    return:
      type: System.Boolean
    content.vb: Function Represents_classifier(diagnostics As Object, context As Object) As Boolean
