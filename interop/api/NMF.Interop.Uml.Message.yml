  summary: " In the case when a Message with messageSort reply has a non empty Operation signature, the arguments of the Message must correspond to the out, inout, and return parameters of the Operation. A Parameter corresponds to an Argument if the Argument is of the same Class or a specialization of that of the Parameter.\r\n(messageSort = MessageSort::reply) and signature.oclIsKindOf(Operation) implies \r\n let replyParms : OrderedSet(Parameter) = signature.oclAsType(Operation).ownedParameter-&gt;\r\nselect(direction = ParameterDirectionKind::inout or direction = ParameterDirectionKind::out or direction = ParameterDirectionKind::return)\r\nin replyParms-&gt;size() = self.argument-&gt;size() and\r\nself.argument-&gt;forAll( o: ValueSpecification | o.oclIsKindOf(Expression) and let e : Expression = o.oclAsType(Expression) in\r\ne.operand-&gt;notEmpty()  implies \r\nlet p : Parameter = replyParms-&gt;at(self.argument-&gt;indexOf(o)) in\r\ne.operand-&gt;asSequence()-&gt;first().type.oclAsType(Classifier).conformsTo(p.type.oclAsType(Classifier))\r\n)"
  example: []
  syntax:
    content: public bool Signature_is_operation_reply(object diagnostics, object context)
    parameters:
    - id: diagnostics
      type: System.Object
      description: The chain of diagnostics to which problems are to be appended.
    - id: context
      type: System.Object
      description: The cache of context-specific information.
    return:
      type: System.Boolean
    content.vb: Public Function Signature_is_operation_reply(diagnostics As Object, context As Object) As Boolean
