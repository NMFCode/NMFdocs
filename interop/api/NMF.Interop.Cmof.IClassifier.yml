    id: IsFinalSpecialization
    path: src/Interop/UMLInterop/Cmof/IClassifier.cs
    startLine: 66
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Cmof
  summary: 'If true, the Classifier cannot be specialized by generalization. Note that this property is preserved through package merge operations; that is, the capability to specialize a Classifier (i.e., isFinalSpecialization =false) must be preserved in the resulting Classifier of a package merge operation where a Classifier with isFinalSpecialization =false is merged with a matching Classifier with isFinalSpecialization =true: the resulting Classifier will have isFinalSpecialization =false.'
  example: []
  syntax:
    content: >-
      [TypeConverter(typeof(LowercaseBooleanConverter))]

      [XmlElementName("isFinalSpecialization")]

