  summary: " An element imported as a metaclassReference is not specialized or generalized in a Profile.\r\nmetaclassReference.importedElement-&gt;\r\n	select(c | c.oclIsKindOf(Classifier) and\r\n		(c.oclAsType(Classifier).allParents()-&gt;collect(namespace)-&gt;includes(self)))-&gt;isEmpty()\r\nand \r\npackagedElement-&gt;\r\n    select(oclIsKindOf(Classifier))-&gt;collect(oclAsType(Classifier).allParents())-&gt;\r\n       intersection(metaclassReference.importedElement-&gt;select(oclIsKindOf(Classifier))-&gt;collect(oclAsType(Classifier)))-&gt;isEmpty()"
  example: []
  syntax:
    content: bool Metaclass_reference_not_specialized(object diagnostics, object context)
    parameters:
    - id: diagnostics
      type: System.Object
      description: The chain of diagnostics to which problems are to be appended.
