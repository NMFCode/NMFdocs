  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: " The query allApplicableStereotypes() returns all the directly or indirectly owned stereotypes, including stereotypes contained in sub-profiles.\r\nresult = (let ownedPackages : Bag(Package) = ownedMember-&gt;select(oclIsKindOf(Package))-&gt;collect(oclAsType(Package)) in\r\n ownedStereotype-&gt;union(ownedPackages.allApplicableStereotypes())-&gt;flatten()-&gt;asSet()\r\n)\r\n&lt;p&gt;From package UML::Packages.&lt;/p&gt;"
  example: []
  syntax:
    content: ISetExpression<IStereotype> AllApplicableStereotypes()
    return:
      type: NMF.Expressions.ISetExpression{NMF.Interop.Uml.IStereotype}
    content.vb: Function AllApplicableStereotypes() As ISetExpression(Of IStereotype)
  overload: NMF.Interop.Uml.IPackage.AllApplicableStereotypes*
