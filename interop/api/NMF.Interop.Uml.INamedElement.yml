      type: NMF.Interop.Uml.INamedElement
      description: ''
    - id: ns
      type: NMF.Interop.Uml.INamespace
      description: ''
    return:
      type: System.Boolean
    content.vb: Function IsDistinguishableFrom(n As INamedElement, ns As INamespace) As Boolean
