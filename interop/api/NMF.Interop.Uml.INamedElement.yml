    startLine: 161
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: " The query allNamespaces() gives the sequence of Namespaces in which the NamedElement is nested, working outwards.\r\nresult = (\r\nif owner = null\r\n  then OrderedSet{}\r\nelse\r\n  let enclosingNamespace : Namespace =\r\n    if owner.oclIsKindOf(TemplateParameter) and owner.oclAsType(TemplateParameter).signature.template.oclIsKindOf(Namespace)\r\n      then owner.oclAsType(TemplateParameter).signature.template.oclAsType(Namespace)\r\n    else\r\n      namespace\r\n    endif\r\n  in enclosingNamespace.allNamespaces()-&gt;prepend(enclosingNamespace)\r\nendif)\r\n&lt;p&gt;From package UML::CommonStructure.&lt;/p&gt;"
  example: []
  syntax:
    content: IOrderedSetExpression<INamespace> AllNamespaces()
    return:
      type: NMF.Collections.Generic.IOrderedSetExpression{NMF.Interop.Uml.INamespace}
    content.vb: Function AllNamespaces() As IOrderedSetExpression(Of INamespace)
  overload: NMF.Interop.Uml.INamedElement.AllNamespaces*
