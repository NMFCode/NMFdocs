  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: " The query isDistinguishableFrom() determines whether two NamedElements may logically co-exist within a Namespace. By default, two named elements are distinguishable if (a) they have types neither of which is a kind of the other or (b) they have different names.\r\nresult = ((self.oclIsKindOf(n.oclType()) or n.oclIsKindOf(self.oclType())) implies\r\n    ns.getNamesOfMember(self)-&gt;intersection(ns.getNamesOfMember(n))-&gt;isEmpty()\r\n)\r\n&lt;p&gt;From package UML::CommonStructure.&lt;/p&gt;"
  example: []
