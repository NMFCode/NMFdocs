  type: Method
  source:
    remote:
      path: Interop/UMLInterop/Cmof/INamedElement.cs
      branch: main
      repo: https://github.com/NMFCode/NMF.git
    id: Has_qualified_name
    path: src/Interop/UMLInterop/Cmof/INamedElement.cs
    startLine: 178
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Cmof
  summary: " When there is a name, and all of the containing namespaces have a name, the qualified name is constructed from the names of the containing namespaces.\r\n(self.name-&gt;notEmpty() and self.allNamespaces()-&gt;select(ns | ns.name-&gt;isEmpty())-&gt;isEmpty()) implies\r\n  self.qualifiedName = self.allNamespaces()-&gt;iterate( ns : Namespace; result: String = self.name | ns.name-&gt;union(self.separator())-&gt;union(result))"
  example: []
  syntax:
    content: bool Has_qualified_name(object diagnostics, object context)
    parameters:
    - id: diagnostics
      type: System.Object
      description: The chain of diagnostics to which problems are to be appended.
    - id: context
      type: System.Object
      description: The cache of context-specific information.
    return:
      type: System.Boolean
    content.vb: Function Has_qualified_name(diagnostics As Object, context As Object) As Boolean
