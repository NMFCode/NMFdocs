      type: System.Collections.Generic.IEnumerable{NMF.Interop.Uml.IPackageableElement}
      description: ''
    return:
      type: NMF.Expressions.ISetExpression{NMF.Interop.Uml.IPackageableElement}
    content.vb: Function ImportMembers(imps As IEnumerable(Of IPackageableElement)) As ISetExpression(Of IPackageableElement)
  overload: NMF.Interop.Uml.INamespace.ImportMembers*
  nameWithType.vb: INamespace.ImportMembers(IEnumerable(Of IPackageableElement))
