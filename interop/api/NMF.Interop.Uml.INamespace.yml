  commentId: M:NMF.Interop.Uml.INamespace.GetNamesOfMember(NMF.Interop.Uml.INamedElement)
  id: GetNamesOfMember(NMF.Interop.Uml.INamedElement)
  parent: NMF.Interop.Uml.INamespace
