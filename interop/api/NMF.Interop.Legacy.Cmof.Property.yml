  namespace: NMF.Interop.Legacy.Cmof
  summary: " Property represents a declared state of one or more instances in terms of a named relationship to a value or values. When a property is an attribute of a classifier, the value or values are related to the instance of the classifier by being held in slots of the instance. When a property is an association end, the value or values are related to the instance or instances at the other end(s) of the association.\r\n\r\n\r\n\r\nProperty is indirectly a subclass of Constructs::TypedElement. The range of valid values represented by the property can be controlled by setting the property's type.\r\nA property is a typed element that represents an attribute of a class."
  example: []
  syntax:
    content: >-
      [AlternativeNamespace("http://schema.omg.org/spec/mof/2.0/emof.xmi")]

      [XmlNamespace("http://schema.omg.org/spec/MOF/2.0/cmof.xml")]

      [XmlNamespacePrefix("cmof")]

      [ModelRepresentationClass("http://schema.omg.org/spec/MOF/2.0/cmof.xml#//Property")]

      public class Property : StructuralFeature, IProperty, IStructuralFeature, ITypedElement, IMultiplicityElement, IFeature, IRedefinableElement, INamedElement, IElement, IModelElement, INotifyPropertyChanged, INotifyPropertyChanging
