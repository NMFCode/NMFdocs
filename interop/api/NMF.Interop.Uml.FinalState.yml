  summary: " A special kind of State, which, when entered, signifies that the enclosing Region has completed. If the enclosing Region is directly contained in a StateMachine and all other Regions in that StateMachine also are completed, then it means that the entire StateMachine behavior is completed.\r\n&lt;p&gt;From package UML::StateMachines.&lt;/p&gt;"
