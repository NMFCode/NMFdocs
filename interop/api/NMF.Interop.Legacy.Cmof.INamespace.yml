  summary: " The Boolean query membersAreDistinguishable() determines whether all of the namespace's members are distinguishable within it.\r\nresult = self.member-&gt;forAll( memb |\r\n	self.member-&gt;excluding(memb)-&gt;forAll(other |\r\n		memb.isDistinguishableFrom(other, self)))"
