- uid: NMF.Interop.Uml.IPseudostate.Transitions_incoming(System.Object,System.Object)
  commentId: M:NMF.Interop.Uml.IPseudostate.Transitions_incoming(System.Object,System.Object)
  id: Transitions_incoming(System.Object,System.Object)
  parent: NMF.Interop.Uml.IPseudostate
  langs:
  - csharp
  - vb
  name: Transitions_incoming(object, object)
  nameWithType: IPseudostate.Transitions_incoming(object, object)
  fullName: NMF.Interop.Uml.IPseudostate.Transitions_incoming(object, object)
  type: Method
  source:
    remote:
      path: Interop/UMLInterop/Uml/IPseudostate.cs
      branch: main
      repo: https://github.com/NMFCode/NMF.git
    id: Transitions_incoming
    path: src/Interop/UMLInterop/Uml/IPseudostate.cs
    startLine: 178
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: " All Transitions incoming a join Vertex must originate in different Regions of an orthogonal State.\r\n(kind = PseudostateKind::join) implies\r\n\r\n-- for any pair of incoming transitions there exists an orthogonal state which contains the source vetices of these transitions \r\n-- such that these source vertices belong to different regions of that orthogonal state \r\n\r\nincoming-&gt;forAll(t1:Transition, t2:Transition | let contState:State = containingStateMachine().LCAState(t1.source, t2.source) in\r\n	((contState &lt;&gt; null) and (contState.region\r\n		-&gt;exists(r1:Region, r2: Region | (r1 &lt;&gt; r2) and t1.source.isContainedInRegion(r1) and t2.source.isContainedInRegion(r2)))))"
  example: []
  syntax:
    content: bool Transitions_incoming(object diagnostics, object context)
    parameters:
    - id: diagnostics
      type: System.Object
      description: The chain of diagnostics to which problems are to be appended.
    - id: context
      type: System.Object
      description: The cache of context-specific information.
    return:
      type: System.Boolean
    content.vb: Function Transitions_incoming(diagnostics As Object, context As Object) As Boolean
  overload: NMF.Interop.Uml.IPseudostate.Transitions_incoming*
  nameWithType.vb: IPseudostate.Transitions_incoming(Object, Object)
  fullName.vb: NMF.Interop.Uml.IPseudostate.Transitions_incoming(Object, Object)
  name.vb: Transitions_incoming(Object, Object)
