  type: Method
  source:
    remote:
      path: Interop/UMLInterop/Uml/IPseudostate.cs
      branch: main
      repo: https://github.com/NMFCode/NMF.git
    id: Transitions_outgoing
    path: src/Interop/UMLInterop/Uml/IPseudostate.cs
    startLine: 107
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: " All transitions outgoing a fork vertex must target states in different regions of an orthogonal state.\r\n(kind = PseudostateKind::fork) implies\r\n\r\n-- for any pair of outgoing transitions there exists an orthogonal state which contains the targets of these transitions \r\n-- such that these targets belong to different regions of that orthogonal state \r\n\r\noutgoing-&gt;forAll(t1:Transition, t2:Transition | let contState:State = containingStateMachine().LCAState(t1.target, t2.target) in\r\n	((contState &lt;&gt; null) and (contState.region\r\n		-&gt;exists(r1:Region, r2: Region | (r1 &lt;&gt; r2) and t1.target.isContainedInRegion(r1) and t2.target.isContainedInRegion(r2)))))"
  example: []
  syntax:
    content: bool Transitions_outgoing(object diagnostics, object context)
    parameters:
    - id: diagnostics
      type: System.Object
      description: The chain of diagnostics to which problems are to be appended.
    - id: context
      type: System.Object
      description: The cache of context-specific information.
    return:
      type: System.Boolean
    content.vb: Function Transitions_outgoing(diagnostics As Object, context As Object) As Boolean
  overload: NMF.Interop.Uml.IPseudostate.Transitions_outgoing*
  nameWithType.vb: IPseudostate.Transitions_outgoing(Object, Object)
  fullName.vb: NMF.Interop.Uml.IPseudostate.Transitions_outgoing(Object, Object)
  name.vb: Transitions_outgoing(Object, Object)
