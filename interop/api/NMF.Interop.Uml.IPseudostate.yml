- uid: NMF.Interop.Uml.IPseudostate.Transitions_outgoing(System.Object,System.Object)
  commentId: M:NMF.Interop.Uml.IPseudostate.Transitions_outgoing(System.Object,System.Object)
  id: Transitions_outgoing(System.Object,System.Object)
