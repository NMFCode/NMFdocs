  namespace: NMF.Interop.Legacy.Cmof
  summary: " The query getNamesOfMember() is overridden to take account of importing. It gives back the set of names that an element would have in an importing namespace, either because it is owned, or if not owned then imported individually, or if not individually then from a package.\r\nresult = if self.ownedMember-&gt;includes(element)\r\nthen Set{}-&gt;include(element.name)\r\nelse let elementImports: ElementImport = self.elementImport-&gt;select(ei | ei.importedElement = element) in\r\n  if elementImports-&gt;notEmpty()\r\n  then elementImports-&gt;collect(el | el.getName())\r\n  else self.packageImport-&gt;select(pi | pi.importedPackage.visibleMembers()-&gt;includes(element))-&gt;collect(pi | pi.importedPackage.getNamesOfMember(element))\r\n  endif\r\nendif"
