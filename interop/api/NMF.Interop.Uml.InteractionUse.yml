    startLine: 475
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: " The InteractionUse must cover all Lifelines of the enclosing Interaction that are common with the lifelines covered by the referred Interaction. Lifelines are common if they have the same selector and represents associationEnd values.\r\nlet parentInteraction : Set(Interaction) = enclosingInteraction-&gt;asSet()-&gt;\r\nunion(enclosingOperand.combinedFragment-&gt;closure(enclosingOperand.combinedFragment)-&gt;\r\ncollect(enclosingInteraction).oclAsType(Interaction)-&gt;asSet()) in\r\nparentInteraction-&gt;size()=1 and let refInteraction : Interaction = refersTo in\r\nparentInteraction.covered-&gt; forAll(intLifeline : Lifeline | refInteraction.covered-&gt;\r\nforAll( refLifeline : Lifeline | refLifeline.represents = intLifeline.represents and \r\n(\r\n( refLifeline.selector.oclIsKindOf(LiteralString) implies\r\n  intLifeline.selector.oclIsKindOf(LiteralString) and \r\n  refLifeline.selector.oclAsType(LiteralString).value = intLifeline.selector.oclAsType(LiteralString).value ) and\r\n( refLifeline.selector.oclIsKindOf(LiteralInteger) implies\r\n  intLifeline.selector.oclIsKindOf(LiteralInteger) and \r\n  refLifeline.selector.oclAsType(LiteralInteger).value = intLifeline.selector.oclAsType(LiteralInteger).value )\r\n)\r\n implies self.covered-&gt;asSet()-&gt;includes(intLifeline)))"
  example: []
  syntax:
    content: public bool All_lifelines(object diagnostics, object context)
    parameters:
    - id: diagnostics
      type: System.Object
      description: The chain of diagnostics to which problems are to be appended.
    - id: context
      type: System.Object
      description: The cache of context-specific information.
    return:
      type: System.Boolean
    content.vb: Public Function All_lifelines(diagnostics As Object, context As Object) As Boolean
  overload: NMF.Interop.Uml.InteractionUse.All_lifelines*
