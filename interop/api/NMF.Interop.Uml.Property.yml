  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: " A Property is a StructuralFeature. A Property related by ownedAttribute to a Classifier (other than an association) represents an attribute and might also represent an association end. It relates an instance of the Classifier to a value or set of values of the type of the attribute. A Property related by memberEnd to an Association represents an end of the Association. The type of the Property is the type of the end of the Association. A Property has the capability of being a DeploymentTarget in a Deployment relationship. This enables modeling the deployment to hierarchical nodes that have Properties functioning as internal parts.  Property specializes ParameterableElement to specify that a Property can be exposed as a formal template parameter, and provided as an actual parameter in a binding of a template.\r\n&lt;p&gt;From package UML::Classification.&lt;/p&gt;"
  example: []
  syntax:
    content: >-
      [XmlNamespace("http://www.eclipse.org/uml2/5.0.0/UML")]

      [XmlNamespacePrefix("uml")]

