  summary: " The query isConsistentWith() specifies, for any two RedefinableElements in a context in which redefinition is possible, whether redefinition would be logically consistent. By default, this is false; this operation must be overridden for subclasses of RedefinableElement to define the consistency conditions.\r\nredefiningElement.isRedefinitionContextValid(self)\r\nresult = (false)\r\n&lt;p&gt;From package UML::Classification.&lt;/p&gt;"
