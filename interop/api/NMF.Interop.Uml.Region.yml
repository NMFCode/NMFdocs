  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: " The query isRedefinitionContextValid() specifies whether the redefinition contexts of this RedefinableElement are properly related to the redefinition contexts of the specified RedefinableElement to allow this element to redefine the other. By default at least one of the redefinition contexts of this element must be a specialization of at least one of the redefinition contexts of the specified element.\r\nresult = (redefinitionContext-&gt;exists(c | c.allParents()-&gt;includesAll(redefinedElement.redefinitionContext)))\r\n&lt;p&gt;From package UML::Classification.&lt;/p&gt;"
