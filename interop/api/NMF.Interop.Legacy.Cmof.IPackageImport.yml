  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Legacy.Cmof
  summary: Specifies the visibility of the imported PackageableElements within the importing Namespace, i.e., whether imported elements will in turn be visible to other packages that use that importingPackage as an importedPackage. If the PackageImport is public, the imported elements will be visible outside the package, while if it is private they will not. By default, the value of visibility is public.
  example: []
  syntax:
    content: >-
      [XmlElementName("visibility")]

      [XmlAttribute(true)]

      VisibilityKind Visibility { get; set; }
    parameters: []
    return:
      type: NMF.Interop.Legacy.Cmof.VisibilityKind
    content.vb: >-
      <XmlElementName("visibility")>

      <XmlAttribute(True)>

      Property Visibility As VisibilityKind
